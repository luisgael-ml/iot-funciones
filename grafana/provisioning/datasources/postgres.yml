# Grafana se conecta con grafana_lector: solo puede ejecutar las funciones de consulta
apiVersion: 1
datasources:
  - name: IoT PostgreSQL (funciones)
    uid: iot-pg
    type: grafana-postgresql-datasource
    url: datos:5432
    user: grafana_lector
    isDefault: true
    jsonData:
      database: iotanalytics
      sslmode: require
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: grafana123
